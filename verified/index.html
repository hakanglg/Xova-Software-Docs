<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified</title>
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

        :root {
            --bg: #0a0a0a;
            --card-bg: #111113;
            --card-border: rgba(255,255,255,0.07);
            --accent: #6366f1;
            --accent-glow: rgba(99,102,241,0.15);
            --green: #22c55e;
            --green-glow: rgba(34,197,94,0.12);
            --text: #e4e4e7;
            --text-muted: #71717a;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
        }

        html { height: 100%; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* subtle radial glow behind card */
        body::before {
            content: '';
            position: fixed;
            top: 50%; left: 50%;
            width: 600px; height: 600px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 48px 36px 40px;
            text-align: center;
            animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* checkmark circle */
        .check-wrap {
            width: 72px; height: 72px;
            margin: 0 auto 28px;
            border-radius: 50%;
            background: var(--green-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulseIn 0.5s 0.15s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes pulseIn {
            from { opacity: 0; transform: scale(0.5); }
            60%  { transform: scale(1.08); }
            to   { opacity: 1; transform: scale(1); }
        }

        .check-wrap svg {
            width: 36px; height: 36px;
        }

        .check-wrap svg path {
            stroke: var(--green);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 28;
            stroke-dashoffset: 28;
            animation: draw 0.45s 0.45s ease-out forwards;
        }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            animation: fadeUp 0.5s 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .subtext {
            font-size: 0.938rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 32px;
            animation: fadeUp 0.5s 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 24px;
            background: var(--accent);
            color: #fff;
            font-family: var(--font);
            font-size: 0.938rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            animation: fadeUp 0.5s 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .btn:hover {
            background: #5457e5;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 24px;
            font-size: 0.813rem;
            color: var(--text-muted);
            opacity: 0.6;
            animation: fadeUp 0.5s 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @media (max-width: 480px) {
            .card {
                padding: 40px 24px 32px;
                border-radius: 16px;
            }
            h1 { font-size: 1.35rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="check-wrap">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h1>Email Verified!</h1>
        <p class="subtext" id="subtext">Your account has been verified successfully. You can now open the app and sign in.</p>
        <button class="btn" type="button" id="openBtn" style="display:none">Open App</button>
        <p class="footer">You can safely close this page.</p>
    </div>
    <script>
        (function() {
            var apps = {
                setwise:     { name: 'Setwise',         scheme: 'setwise://' },
                pixivo:      { name: 'Pixivo',          scheme: 'pixivo://' },
                tatarai:     { name: 'Tatarai',         scheme: 'tatarai://' },
                xovapdfmaker:{ name: 'Xova PDF Maker',  scheme: 'xovapdfmaker://' }
            };
            var params = new URLSearchParams(window.location.search);
            var key = (params.get('app') || '').toLowerCase();
            var app = apps[key];
            var btn = document.getElementById('openBtn');
            var sub = document.getElementById('subtext');
            if (app) {
                document.title = 'Email Verified - ' + app.name;
                sub.textContent = 'Your account has been verified successfully. You can now open the ' + app.name + ' app and sign in.';
                btn.textContent = 'Open ' + app.name;
                btn.style.display = '';
                btn.addEventListener('click', function() {
                    window.location.href = app.scheme;
                });
            }
        })();
    </script>
</body>
</html>
