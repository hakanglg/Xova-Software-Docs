<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#22272D">
<meta name="robots" content="noindex, nofollow">
<title>RSR Auto Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Tokenlar =====
   Kişilik: atölye defteri — sağlam, net, sakin.
   Tek vurgu: sinyal sarısı (yalnız dolgu; üstünde koyu metin). Durum renkleri her yerde aynı. */
:root{
  --bg:#E8EBEE;--col:#DCE1E6;--surface:#FFFFFF;--sunk:#F3F5F7;
  --ink:#1C2126;--ink-2:#4B545E;--ink-3:#5C6570;--line:#D2D8DE;--line-2:#AEB7C0;--field:#868F99;
  --top:#22272D;--top-2:#323940;--top-ink:#F2F4F6;--top-ink-2:#B4BCC5;
  --acc:#F2B90F;--acc-h:#E2A800;--on-acc:#1C2126;
  --s0:#5D6875;--s1:#1D5FD1;--s2:#17804A;--s3:#7F8892;
  --s0-bg:#E7EAEE;--s1-bg:#E4EDFC;--s2-bg:#E2F3E9;--s3-bg:#EDEFF1;
  --wa:#157A3E;--wa-h:#0F6232;--danger:#B42318;--warn:#8A5300;--warn-bg:#FBEFD2;
  --plate-blue:#1F49A8;--focus:#1D5FD1;
  --r-sm:6px;--r:10px;--r-lg:14px;
  --sh-1:0 1px 2px rgba(28,33,38,.10),0 0 0 1px rgba(28,33,38,.04);
  --sh-2:0 10px 28px rgba(28,33,38,.14),0 2px 6px rgba(28,33,38,.08);
  --sh-3:0 24px 64px rgba(16,20,24,.30);
  --t-sm:14px;--t-md:17px;--t-lg:20px;--t-xl:24px;--t-2xl:29px;
  --font:"Barlow","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:var(--t-md);line-height:1.4;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top :focus-visible{outline-color:var(--acc)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Düğmeler ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:16px;white-space:nowrap;text-decoration:none;transition:background-color .12s,border-color .12s}
.btn:hover{background:var(--sunk);border-color:#8E99A4}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700}
.btn-primary:hover{background:var(--acc-h);border-color:var(--acc-h)}
.btn-wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn-wa:hover{background:var(--wa-h);border-color:var(--wa-h)}
.btn-danger{color:var(--danger);border-color:#E3B5B0}
.btn-danger:hover{background:#FCEEEC;border-color:var(--danger)}
.btn-quiet{border-color:transparent;background:transparent}
.btn-quiet:hover{background:rgba(28,33,38,.06);border-color:transparent}
.btn-icon{width:48px;padding:0}
.btn-lg{min-height:48px;font-size:var(--t-md);padding:0 22px}
.linkbtn{border:0;background:none;padding:0 2px;color:var(--s1);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:32px}

/* ===== Plaka rozeti ===== */
.plate{display:inline-flex;align-items:stretch;height:30px;border:1.5px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%}
.plate-tr{display:flex;align-items:flex-end;justify-content:center;min-width:18px;padding:0 2px 3px;background:var(--plate-blue);color:#fff;font-size:9px;letter-spacing:.02em;font-weight:600}
.plate-no{display:flex;align-items:center;padding:0 9px 0 8px;font-size:18px;line-height:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.plaka-alan{display:flex;gap:8px;min-width:0}.plaka-alan input{flex:1;min-width:0}
.ulke-kutu{position:relative;display:flex;align-items:center;flex:0 0 92px;width:92px;padding:0 34px 0 12px;font-weight:700;font-size:18px;letter-spacing:.04em;cursor:pointer}
.ulke-kutu:focus-within{border-color:var(--focus);outline:2px solid var(--focus);outline-offset:-1px}
.ulke-kutu .ulke-sel{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;border:0}
.plate.none .plate-no{color:var(--ink-3);font-weight:500;letter-spacing:0}
.plate.lg{height:44px;border-width:2px;border-radius:7px}
.plate.lg .plate-tr{min-width:26px;font-size:12px;padding:0 3px 5px}
.plate.lg .plate-no{font-size:28px;padding:0 14px 0 12px}

/* ===== Üst çubuk ===== */
.top{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:auto minmax(280px,560px) 1fr auto;align-items:center;gap:20px;padding:12px 24px;background:var(--top);color:var(--top-ink)}
@media (min-width:1100px){.top{grid-template-columns:max-content minmax(240px,560px) 1fr auto}}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:40px;height:40px;border-radius:8px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.02em;flex:none}
.brand-txt{min-width:0}
.firma-btn{display:flex;align-items:center;gap:6px;border:0;background:none;padding:2px 4px;margin:-2px -4px;border-radius:6px;color:var(--top-ink);font-weight:700;font-size:var(--t-lg);line-height:1.15;max-width:280px}
.firma-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.firma-btn .ico{width:16px;height:16px;color:var(--top-ink-2);opacity:0;transition:opacity .12s}
.firma-btn:hover .ico,.firma-btn:focus-visible .ico{opacity:1}
.firma-in{font-weight:700;font-size:var(--t-lg);height:36px;width:280px;max-width:100%;border:2px solid var(--acc);border-radius:6px;padding:0 8px;background:var(--top-2);color:var(--top-ink)}
.brand-sub{font-size:var(--t-sm);color:var(--top-ink-2)}
.search{position:relative}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#6C7681;pointer-events:none}
.search input{width:100%;height:48px;border:0;border-radius:10px;padding:0 14px 0 44px;background:#fff;color:var(--ink);font-size:var(--t-md)}
.search input::placeholder{color:#69727D}
.search input:focus{outline:3px solid var(--acc);outline-offset:0}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 13px var(--font);color:var(--ink-3);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 6px;background:var(--sunk)}
.top-acts{display:flex;align-items:center;gap:10px;justify-self:end}
.savestate{display:flex;align-items:center;gap:6px;font-size:var(--t-sm);color:var(--top-ink-2);white-space:nowrap;justify-self:end}
.savestate .ico{width:16px;height:16px}
.savestate.bad{color:#FFB4A8;font-weight:600}
.btn-dark{background:transparent;color:var(--top-ink);border-color:#535C66}
.btn-dark:hover{background:var(--top-2);border-color:#6E7883}

/* Arama sonuçları */
.results{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;color:var(--ink);border-radius:var(--r);box-shadow:var(--sh-3);padding:6px;max-height:min(70vh,520px);overflow:auto;z-index:40}
.res{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 10px;border:0;border-radius:8px;background:none;text-align:left}
.res[aria-selected="true"],.res:hover{background:var(--sunk)}
.res-who{min-width:0}
.res-who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-who small{display:block;color:var(--ink-3);font-size:var(--t-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-none{padding:14px 12px;color:var(--ink-2)}
.res-foot{border-top:1px solid var(--line);margin-top:6px;padding:6px 4px 2px}
.res-foot .btn{width:100%;justify-content:flex-start}

/* ===== Araç çubuğu ===== */
.toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 24px 8px}
.seg{display:inline-flex;background:var(--col);border-radius:10px;padding:3px;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:0;border-radius:8px;background:none;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--sh-1)}
.seg .ico{width:18px;height:18px}
.tb-sum{color:var(--ink-2)}
.tb-sum b{color:var(--ink);font-weight:700}
.sample{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:var(--t-sm);color:var(--ink-2);background:var(--surface);border:1px dashed var(--line-2);border-radius:8px;padding:4px 4px 4px 12px}
.sample b{color:var(--ink)}
.sample .btn{min-height:36px;font-size:var(--t-sm);padding:0 12px}

/* ===== Pano ===== */
.pano{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:8px 24px 40px;align-items:start}
.col{background:var(--col);border-radius:var(--r-lg);padding:12px 10px 10px;min-height:240px;transition:box-shadow .12s,background-color .12s}
.col.drop{background:#D1D8DF;box-shadow:inset 0 0 0 2px var(--dc)}
.col-h{display:flex;align-items:center;gap:8px;padding:0 4px 10px}
.col-h h2{margin:0;font-size:var(--t-md);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dc);flex:none}
.cnt{margin-left:auto;min-width:28px;height:24px;border-radius:12px;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:var(--t-sm);font-weight:700;color:var(--ink-2);padding:0 8px}
.col-b{display:grid;gap:10px}
.col-empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:20px 16px;color:var(--ink-2);font-size:var(--t-sm);text-align:center;line-height:1.45}
.col-more{margin-top:8px;width:100%}
.s0{--dc:var(--s0);--dbg:var(--s0-bg)}.s1{--dc:var(--s1);--dbg:var(--s1-bg)}.s2{--dc:var(--s2);--dbg:var(--s2-bg)}.s3{--dc:var(--s3);--dbg:var(--s3-bg)}

.card{position:relative;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);cursor:pointer;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:var(--sh-2)}
.card.dragging{opacity:.45}
.card-main{display:grid;grid-template-columns:1fr auto;gap:6px 12px;width:100%;padding:14px 14px 10px;border:0;background:none;text-align:left;border-radius:var(--r) var(--r) 0 0}
.card-main:focus-visible{outline-offset:-3px}
.card-plate{grid-column:1/-1;display:flex;align-items:center;gap:8px;min-width:0}
.card-plate{padding-right:40px}
.card-txt{min-width:0}
.card-model{font-weight:700;font-size:var(--t-md);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-cust{color:var(--ink-2);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-job{grid-column:1/-1;margin-top:2px;font-size:16px;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-job.none{color:var(--ink-3)}
.thumb{width:64px;height:48px;border-radius:6px;object-fit:cover;background:var(--sunk);align-self:start}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2)}
.card-f{display:flex;align-items:center;gap:8px;padding:8px 10px 10px;border-top:1px solid #EDF0F2}
.age{grid-column:1/-1;font-size:15px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.age.warn{color:var(--warn);font-weight:600}
.age .ico{width:16px;height:16px}
.card-f .btn{min-height:44px;padding:0 12px;font-size:16px;gap:6px}
.btn-msg{color:var(--wa);border-color:#BFDCC9;background:#fff}
.btn-msg:hover{background:#E6F3EB;border-color:var(--wa)}
.btn-msg .ico{width:20px;height:20px}
.card-f .btn-next{margin-left:auto;background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;padding:0 10px 0 16px}
.btn-next .ico{width:18px;height:18px}
.btn-next:hover{background:#000;border-color:#000}

.mob-cols{display:none}

/* ===== Liste ===== */
.liste{padding:8px 24px 40px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;background:#fff;font-weight:600;font-size:16px}
.chip:hover{border-color:#8E99A4}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{font-size:var(--t-sm);opacity:.75;font-weight:600}
.filters .sep{width:1px;height:28px;background:var(--line-2);margin:0 6px}
.filters input[type=date]{height:48px;border:1px solid var(--field);border-radius:8px;padding:0 10px;background:#fff}
.note{display:flex;align-items:center;gap:12px;color:var(--ink-2);margin:0 0 10px;min-height:32px}
/* Liste: süzgeç çubuğu */
.lf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.lf-seg{display:inline-flex;gap:2px;background:var(--col);padding:3px;border-radius:12px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.lf-seg::-webkit-scrollbar,.lf::-webkit-scrollbar,.mob-cols::-webkit-scrollbar{display:none}
.lf-b{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 12px;border:0;border-radius:9px;background:none;font-weight:600;font-size:15px;color:var(--ink-2);white-space:nowrap;flex:none}
.lf-b:hover{color:var(--ink)}
.lf-b small{font-size:13px;font-weight:700;color:var(--ink-2);background:rgba(255,255,255,.65);border-radius:10px;padding:1px 7px;min-width:24px;text-align:center}
.lf-b[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--sh-1)}
.lf-b[aria-pressed="true"] small{background:var(--ink);color:#fff}
.lf-c{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 14px;border:1px solid var(--line-2);border-radius:12px;background:#fff;font-weight:600;font-size:15px;white-space:nowrap;cursor:pointer;flex:none;color:var(--ink)}
.lf-c:hover{border-color:#8E99A4}
.lf-c[aria-pressed="true"],.lf-c.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.lf-c .ico{width:18px;height:18px;color:var(--ink-2)}
.lf-c input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.lf-c:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.lf-x{width:46px;padding:0;justify-content:center}
/* Liste: gün grupları ve satırlar */
.lg{margin-bottom:18px}
.lg-h{position:sticky;top:var(--top-h,72px);z-index:5;display:flex;align-items:baseline;gap:10px;margin:0;padding:10px 4px 8px;background:var(--bg);font-size:var(--t-md);font-weight:700}
.lg-h small{margin-left:auto;font-size:var(--t-sm);font-weight:600;color:var(--ink-3);white-space:nowrap}
.lg-b{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.lr,.lr-head{display:grid;grid-template-columns:150px minmax(150px,1fr) minmax(200px,1.7fr) 136px 112px 44px;align-items:center;gap:14px;padding:10px 10px 10px 20px}
.lr-head{padding-top:0;padding-bottom:4px;font-size:13px;font-weight:600;color:var(--ink-3)}
.lr-head span:nth-child(5){text-align:right}
.lr{position:relative;border-top:1px solid #EDF0F2;cursor:pointer;min-height:64px}
.lr:first-child{border-top:0}
.lr::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--dc)}
.lr:hover{background:#F8FAFB}
.lr-pl{justify-self:start}
.lr-who{min-width:0}
.lr-who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr-who small{display:block;font-size:var(--t-sm);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr-job{display:flex;align-items:center;gap:6px;min-width:0}
.lr-jt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lr-job.none .lr-jt{color:var(--ink-3)}
.lr-more{flex:none;font-size:13px;font-weight:700;color:var(--ink-2);background:var(--sunk);border-radius:6px;padding:1px 6px}
.lr-job .tag{flex:none}
.lr .stsel{width:100%}
.lr .lr-pill{display:none}
.openbtn{border:0;background:none;padding:0;border-radius:6px}
.lr-top{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lr-top.bos{color:var(--ink-3);font-weight:500}
.lr.done .lr-who b,.lr.done .lr-jt{color:var(--ink-2)}
.lr .btn-more{position:static}
.bnav{display:none}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.tbl th{font-size:var(--t-sm);font-weight:600;color:var(--ink-3);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--sunk)}
.tbl td{padding:12px 14px;border-bottom:1px solid #EDF0F2;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#F8FAFB}
.tbl tr.done td{color:var(--ink-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.tbl .who b{display:block;font-weight:600}
.tbl .who small{display:block;color:var(--ink-3);font-size:var(--t-sm)}
.tbl .openbtn{border:0;background:none;padding:0;border-radius:6px}
.jobs{max-width:340px}
.jobs small{display:block;color:var(--ink-3);font-size:var(--t-sm)}
.stsel{height:40px;border-radius:999px;border:1px solid var(--dc);background:var(--dbg);color:var(--ink);font-weight:600;padding:0 10px;max-width:100%}
.empty{background:#fff;border:1.5px dashed var(--line-2);border-radius:var(--r-lg);padding:40px 24px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:var(--t-lg);margin-bottom:4px}
.empty .btn{margin-top:14px}

/* Durum hapı */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;background:var(--dbg);color:var(--ink);font-size:var(--t-sm);font-weight:600;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dc)}

/* ===== Çekmece (araç detayı) ===== */
.scrim{position:fixed;inset:0;background:rgba(22,26,30,.42);z-index:50;animation:fade .16s ease-out}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1000px,94vw);background:var(--bg);z-index:51;display:flex;flex-direction:column;box-shadow:var(--sh-3);animation:slide .2s ease-out}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(32px);opacity:.4}}
.dh{background:var(--surface);padding:18px 24px 0}
.tabbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 24px;position:sticky;top:0;z-index:2}
.dh-top{display:flex;align-items:center;gap:16px}
.dh-who{min-width:0;flex:1}
.dh-who h2{margin:0;font-size:var(--t-xl);line-height:1.15;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh-who h2:focus{outline:none}
.dh-who div{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh-who a{color:inherit}
.dh-acts{display:flex;gap:8px;flex:none}
.stepbar{display:flex;align-items:center;gap:16px;margin:18px 0 4px;flex-wrap:wrap}
.steps{display:flex;list-style:none;margin:0;padding:0;flex:1;min-width:0}
.steps li{flex:1;min-width:0;position:relative}
.steps li+li::before{content:"";position:absolute;left:-50%;right:50%;top:21px;height:2px;background:var(--line);margin:0 22px}
.steps li.done+li::before,.steps li.done::before{background:var(--ink-2)}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;min-height:64px;padding:4px 2px;border:0;background:none;border-radius:8px;font-size:15px;color:var(--ink-3);font-weight:600;position:relative;z-index:1}
.step:hover{color:var(--ink)}
.step-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);background:#fff;color:var(--ink-3);font-size:15px;margin-top:4px}
.step-dot .ico{width:18px;height:18px}
.done .step-dot{background:var(--ink-2);border-color:var(--ink-2);color:#fff}
.done .step{color:var(--ink-2)}
.cur .step{color:var(--ink)}
.cur .step-dot{background:var(--dc);border-color:var(--dc);color:#fff;box-shadow:0 0 0 5px var(--dbg)}
.stepbar .btn{flex:none}
.tabs{display:flex;gap:4px;margin:8px -8px 0;overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border:0;background:none;border-bottom:3px solid transparent;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab small{font-size:13px;font-weight:700;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:0 7px;line-height:20px}
.db{flex:1;overflow:auto;padding:20px 24px 40px;overscroll-behavior:contain}
.panel{display:grid;gap:16px;max-width:920px}
.box{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:20px}
.box-h{display:flex;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.box-h h3{margin:0;font-size:var(--t-lg);font-weight:700}
.box-h .btn{margin-left:auto}
.hint{color:var(--ink-3);font-size:var(--t-sm);line-height:1.45}

/* İş seçici: araç silüeti */
.picker{display:grid;grid-template-columns:400px 1fr;grid-template-areas:'car islem' 'car parca';grid-template-rows:auto 1fr;gap:8px 28px;align-items:start}
.pk-car{grid-area:car}.pk-islem{grid-area:islem}.pk-parca{grid-area:parca;margin-top:14px}
.car-wrap{position:relative}
.car{display:block;width:100%;max-width:400px;height:auto;margin:0 auto;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:visible}
.car .body{fill:#EFEFEF;stroke:#D6D6D6;stroke-width:2.5;stroke-linejoin:round}
.car .pg{cursor:pointer;outline:none}
.car .p{fill:#EFEFEF;stroke:#D6D6D6;stroke-width:2.5;stroke-linejoin:round;transition:fill .12s}
.car .hit{fill:transparent}
.car .pg:hover .p{stroke:#9AA3AD}
.car .pg.on .p{stroke:var(--ink);stroke-width:4}
.car .pg:focus-visible .p{stroke:var(--focus);stroke-width:5}
.car .glass{fill:#D0D0D0;stroke:#C4C4C4;stroke-width:1.5;stroke-linejoin:round;pointer-events:none}
.car .handle{fill:#D6D6D6;pointer-events:none}
.car .roz{fill:#fff;stroke:var(--ink);stroke-width:2}
.car .roz-t{font:700 20px var(--font);fill:var(--ink);text-anchor:middle}
.car .rozler{pointer-events:none}
.car .lbl{font:600 22px var(--font);fill:var(--ink-3);pointer-events:none;text-anchor:middle}
.ptip{position:absolute;z-index:3;pointer-events:none;background:var(--top);color:#fff;font-size:14px;font-weight:600;padding:5px 10px;border-radius:6px;white-space:nowrap;box-shadow:var(--sh-2)}
.car-cap{margin-top:6px;text-align:center;min-height:24px;font-weight:600;color:var(--ink-2)}
.legend{display:flex;justify-content:center;gap:8px 14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:16px;border-radius:4px;border:3px solid var(--ink);background:#EFEFEF}
.sw{display:inline-grid;place-items:center;min-width:28px;height:22px;padding:0 4px;border-radius:11px;font-size:11px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(28,33,38,.25)}
.qc-tur{display:inline-flex;align-items:center;gap:8px}
.step-h{font-weight:700;margin:0 0 10px;font-size:var(--t-md)}
.step-h span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;margin-right:8px;vertical-align:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.qc{min-height:48px;padding:0 16px;border:1.5px solid var(--line-2);border-radius:8px;background:#fff;font-weight:600;font-size:16px}
.qc:hover{border-color:var(--ink-2)}
.qc[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.sel{display:flex;gap:6px;flex-wrap:wrap;min-height:48px;align-items:center}
.selc{display:inline-flex;align-items:center;gap:2px;height:36px;padding:0 2px 0 12px;border-radius:18px;background:#FDF3D3;border:1px solid #E5C25A;font-weight:600;font-size:15px}
.selc button{width:32px;height:32px;border:0;background:none;border-radius:50%;display:grid;place-items:center}
.selc button:hover{background:rgba(28,33,38,.08)}
.selc .ico{width:16px;height:16px}
.pick-go{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}

/* İş kalemleri */
.lines-h,.line{display:grid;grid-template-columns:156px 170px minmax(0,1fr) 128px 48px;gap:8px;align-items:center}
.lines-h{font-size:var(--t-sm);color:var(--ink-3);font-weight:600;padding:0 2px 6px}
.lines-h span:nth-child(4){text-align:right;padding-right:10px}
.line{padding:6px 0;border-top:1px solid #EDF0F2}
.line:first-of-type{border-top:0}
.lbl-m{display:none}
.f{width:100%;height:48px;padding:0 12px;border:1px solid var(--field);border-radius:8px;background:#fff;font-size:16px}
.f:hover{border-color:#8E99A4}
.f:focus{border-color:var(--focus);outline:2px solid var(--focus);outline-offset:-1px}
.f.money{text-align:right;font-variant-numeric:tabular-nums}
.f.big{font-size:22px;font-weight:700;letter-spacing:.06em}
.f::placeholder{color:var(--ink-3);opacity:.7;font-weight:400;letter-spacing:0}
input.f[type=date]{padding-right:8px}
#gecmis:empty{display:none}
.del{color:var(--ink-3);border-color:transparent;background:transparent}
.del:hover{color:var(--danger);background:#FCEEEC;border-color:transparent}
.lines-add{margin-top:10px}
.l-not{grid-column:2/-1;display:grid;gap:6px;justify-items:start}
.not-r{display:flex;align-items:center;gap:6px;width:100%}
.not-r .f{flex:1;min-width:0;min-height:40px;background:#FFFBEA;border-color:#EADFB4;resize:none;overflow:hidden;line-height:1.35;padding-top:9px;padding-bottom:9px}
.not-r{align-items:flex-start}.not-r .not-ic{padding-top:12px}
.not-ic{display:grid;place-items:center;width:28px;color:var(--ink-3)}.not-ic .ico{width:16px;height:16px}
.not-ekle{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-sm);text-decoration:none;min-height:30px}.not-ekle .ico{width:16px;height:16px}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:16px;padding:16px 20px;border-radius:var(--r);background:var(--top);color:var(--top-ink)}
.total span{font-weight:600}
.total small{color:var(--top-ink-2);font-size:var(--t-sm);font-weight:500;margin-left:6px}
.total b{white-space:nowrap;font-size:var(--t-2xl);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* Form alanları */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fld label{display:block;font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.fld label small{font-weight:500;color:var(--ink-3)}
.fld .f{height:48px;font-size:var(--t-md)}
.fld .msg{font-size:var(--t-sm);margin-top:6px;color:var(--warn)}
.span2{grid-column:1/-1}
.hist{border-radius:var(--r);padding:14px 16px;background:var(--s1-bg);border:1px solid #BFD1F4}
.hist.new{background:var(--sunk);border-color:var(--line);color:var(--ink-2)}
.hist b{font-weight:700}
.hist ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:2px}
.hist li{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cb{position:relative}
.cb .f{padding-right:40px}
.cb-car{position:absolute;right:12px;top:50%;transform:translateY(-50%) rotate(90deg);color:var(--ink-3);pointer-events:none;display:flex}
.cb-car .ico{width:18px;height:18px}
.cb .f:disabled{background:var(--sunk);color:var(--ink-3);cursor:not-allowed}
.cb-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:#fff;border-radius:10px;box-shadow:var(--sh-3);padding:6px;max-height:300px;overflow:auto}
.cb-grp{font-size:13px;font-weight:600;color:var(--ink-3);padding:8px 10px 4px}
.cb-opt{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:8px;cursor:pointer}
.cb-opt:hover,.cb-opt[aria-selected="true"]{background:var(--s1-bg)}
.cb-opt .ico{width:18px;height:18px;margin-left:auto;color:var(--s1)}
.cb-roz{width:28px;height:28px;border-radius:50%;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--ink-2);flex:none}
.cb-ozel{border-top:1px solid var(--line);margin-top:4px;border-radius:0 0 8px 8px;color:var(--ink-2);font-weight:600}
.cb-ozel .ico{margin-left:0;color:var(--ink-3)}
.cb-none{padding:10px;color:var(--ink-2);font-size:var(--t-sm)}
.hist.warn{background:var(--warn-bg);border-color:#E9C46A}
.hist-h{display:flex;gap:8px;align-items:flex-start}
.hist-h .ico{flex:none;margin-top:2px;color:var(--warn)}
.hist li .pill{height:22px;font-size:13px}
.btn-danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger-solid:hover{background:#962015;border-color:#962015}
.modal.narrow{max-width:460px}
.btn-more{position:absolute;top:6px;right:6px;z-index:1;color:var(--ink-2);border-color:transparent;background:transparent}
.btn-more:hover{background:var(--sunk);border-color:transparent}
.tbl .btn-more{position:static}
.menu{position:fixed;z-index:90;min-width:180px;background:#fff;border-radius:10px;box-shadow:var(--sh-3);padding:6px;display:grid;gap:2px}
.mi{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;background:none;border-radius:8px;font-weight:600;text-align:left}
.mi:hover,.mi:focus{background:var(--sunk);outline:none}
.mi:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.mi.danger{color:var(--danger)}
.tur-duzen{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 8px;font-size:15px}
.tur-duzen .ico{width:16px;height:16px}
.tur-list{list-style:none;margin:0 0 14px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tur-row{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 6px;background:#fff;border-top:1px solid #EDF0F2}
.tur-row:first-child{border-top:0}
.tur-row.dragging{opacity:.4}.tur-row.over{box-shadow:inset 0 3px 0 var(--focus)}
.tur-tut{width:20px;text-align:center;color:var(--ink-3);cursor:grab;font-weight:700;letter-spacing:-2px;user-select:none}
.tur-ad{flex:1;min-width:0;display:grid}
.tur-ad small{color:var(--ink-3);font-size:var(--t-sm)}
.tur-acts{display:flex;gap:0}
.tur-acts .btn:disabled{opacity:.3}
.tur-form-li{padding:12px;background:var(--sunk);border-top:1px solid #EDF0F2}
.tur-form{background:var(--sunk);border-radius:10px;padding:14px}
.tur-form-li .tur-form{padding:0}
.tur-form .acts{margin-top:12px}
/* form açıkken pencerenin alt çubuğu formun Vazgeç/Ekle düğmeleridir (Bitti gizlenir) */
.tur-form .acts,.ts-form .acts{position:sticky;bottom:0;z-index:5;background:inherit;padding:12px 0;margin-bottom:-12px;border-top:1px solid var(--line)}
.tur-form-li .tur-form .acts,.ts-form .acts{background:var(--surface)}
.tur-onay{background:#FCEEEC;border:1px solid #E3B5B0;border-radius:10px;padding:16px}
.tur-onay p{margin:0}
.fld-l{display:block;font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.palet{display:flex;flex-wrap:wrap;gap:8px}
.pal{position:relative;width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:var(--pc);box-shadow:0 0 0 1px var(--line-2)}
.pal[aria-checked="true"]{box-shadow:0 0 0 3px var(--ink)}
.pal-k{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ink-3)}
.sw{flex:none}
.pk-uyari.warn{color:var(--warn);font-weight:600}
.danger-zone{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* Fotoğraflar */
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pcol{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:16px;display:flex;flex-direction:column;gap:12px}
.pcol h3{margin:0;font-size:var(--t-md);font-weight:700;display:flex;align-items:center;gap:8px}
.pcol h3 small{font-weight:600;color:var(--ink-3);font-size:var(--t-sm)}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtns .btn{padding:0 10px}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.th{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--sunk)}
.th button.zoom{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}
.th img{display:block;width:100%;height:100%;object-fit:cover}
.th .tbtn{position:absolute;top:6px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(22,26,30,.72);color:#fff;display:grid;place-items:center}
.th .rm{right:6px}.th .crp{right:48px}
.th .tbtn .ico{width:18px;height:18px}
.th .rm:hover{background:var(--danger)}.th .crp:hover{background:var(--top)}
.modal.crop-modal{max-width:920px}
.crop{display:grid;gap:14px}
.crop-stage{background:#2A3036;border-radius:10px;padding:16px;display:grid;place-items:center;min-height:200px;overflow:hidden}
.crop-in{position:relative;line-height:0}
.crop-cv{display:block;max-width:none}
.crop-box{position:absolute;box-shadow:0 0 0 9999px rgba(16,20,24,.6);outline:2px solid #fff;cursor:move;touch-action:none}
.crop-box:focus-visible{outline:3px solid var(--acc)}
.crop-grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#ffffff59,#ffffff59) 33.33% 0/1px 100% no-repeat,linear-gradient(#ffffff59,#ffffff59) 66.66% 0/1px 100% no-repeat,linear-gradient(#ffffff59,#ffffff59) 0 33.33%/100% 1px no-repeat,linear-gradient(#ffffff59,#ffffff59) 0 66.66%/100% 1px no-repeat}
.hnd{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;touch-action:none}
.hnd::after{content:"";position:absolute;left:8px;top:8px;width:12px;height:12px;background:#fff;border:2px solid var(--ink);border-radius:3px}
.hnd-nw{left:0;top:0;cursor:nwse-resize}.hnd-n{left:50%;top:0;cursor:ns-resize}.hnd-ne{left:100%;top:0;cursor:nesw-resize}.hnd-e{left:100%;top:50%;cursor:ew-resize}
.hnd-se{left:100%;top:100%;cursor:nwse-resize}.hnd-s{left:50%;top:100%;cursor:ns-resize}.hnd-sw{left:0;top:100%;cursor:nesw-resize}.hnd-w{left:0;top:50%;cursor:ew-resize}
.crop-box.ratio .hnd-n,.crop-box.ratio .hnd-e,.crop-box.ratio .hnd-s,.crop-box.ratio .hnd-w{display:none}
.crop-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crop-size{margin-left:auto;color:var(--ink-3);font-size:var(--t-sm);font-variant-numeric:tabular-nums}
.pempty{border:1.5px dashed var(--line-2);border-radius:8px;min-height:120px;display:grid;place-items:center;text-align:center;color:var(--ink-3);font-size:var(--t-sm);padding:12px}

/* Mesaj */
.msg-grid{display:grid;gap:14px}
.ta{width:100%;min-height:140px;padding:12px 14px;border:1px solid var(--field);border-radius:8px;background:#fff;font-size:var(--t-md);line-height:1.5;resize:vertical}
.ta:focus{border-color:var(--focus);outline:2px solid var(--focus);outline-offset:-1px}
.num{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.num.bad{color:var(--danger);font-weight:600}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ===== Modal ===== */
.modal-wrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(22,26,30,.5);animation:fade .14s ease-out}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--sh-3);width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;padding:24px}
.modal.wide{max-width:640px}
.modal-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.modal-h h2{margin:0;font-size:var(--t-xl);font-weight:700;flex:1}
.modal p.lead{margin:0 0 18px;color:var(--ink-2)}
.modal .acts{margin-top:20px;justify-content:flex-end}
.form-err{color:var(--danger);font-weight:600;margin-top:12px}
.rng{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 10px}
.tsec{display:flex;margin:4px 0 12px}.tsec button{flex:1;justify-content:center}
.exsum{padding:12px 14px;background:var(--sunk);border-radius:8px;color:var(--ink-2)}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:70;background:rgba(10,12,14,.9);display:flex;align-items:center;justify-content:center;padding:56px 16px 16px}
.lb>img{max-width:100%;max-height:100%;border-radius:6px}
.lb .x{position:absolute;top:10px;right:10px;color:#fff;background:rgba(255,255,255,.12);border:0}
.lb .x:hover{background:rgba(255,255,255,.22)}
.cmp{display:flex;gap:12px;align-items:flex-start;max-height:100%;overflow:auto}
.cmp figure{margin:0;color:#fff;text-align:center;font-weight:600}
.cmp img{max-width:46vw;max-height:80vh;display:block;border-radius:6px;margin-bottom:8px}

/* Toast */
.toasts{position:fixed;left:24px;bottom:24px;z-index:80;display:grid;gap:8px;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:12px;background:var(--top);color:var(--top-ink);border-radius:10px;padding:8px 8px 8px 16px;box-shadow:var(--sh-2);min-height:48px;animation:up .18s ease-out}
.toast .ico{color:#7BD89F}
.toast.err{background:#7A1A12}
.toast.err .ico{color:#FFC9C0}
.toast .btn{min-height:36px;background:transparent;color:var(--acc);border-color:transparent;padding:0 10px}
.toast .btn:hover{background:var(--top-2)}
@keyframes up{from{transform:translateY(8px);opacity:0}}

/* ===== Giriş (demo) ===== */
.giris{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:var(--top);overflow:auto}
.giris-kart{width:100%;max-width:420px;background:var(--surface);border-radius:16px;box-shadow:var(--sh-3);padding:28px}
.giris-ust{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.giris-ust h1{margin:0;font-size:var(--t-xl);line-height:1.15}
.giris-ust small{display:block;color:var(--ink-3);font-size:var(--t-sm);font-weight:500}
.giris form{display:grid;gap:14px}
.giris .chips .qc{flex:1 1 0;min-width:0;padding:0 10px}
.giris .btn-primary{width:100%}
.demo-not{display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);border:1px solid #E9C46A;border-radius:10px;padding:10px 12px;font-size:var(--t-sm);color:var(--ink-2)}
.demo-not .ico{width:18px;height:18px;flex:none;color:var(--warn);margin-top:1px}
.kullanici{display:flex;align-items:center;gap:8px;color:var(--top-ink-2);font-size:var(--t-sm);white-space:nowrap}

  return r.fotolar.filter(function(f){return f.et!=='surec';}).map(function(f,i){return dataFile(f.src,base+'-'+f.et+'-'+(i+1)+'.jpg');});
}
function fotoIndir(fl){
  fl.forEach(function(f,i){setTimeout(function(){
    var a=h('a',{href:URL.createObjectURL(f),download:f.name});document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},800);},i*300);});
}
function fotoPaylas(r,text){
  var fl=paylasilacak(r);
  if(!fl.length){toast('Bu araçta önce veya sonra fotoğrafı yok. Fotoğraflar sekmesinden ekleyin.','err');return;}
  if(navigator.canShare&&navigator.share&&navigator.canShare({files:fl})){
    navigator.share({files:fl,text:text}).catch(function(e){if(e&&e.name!=='AbortError')toast('Paylaşılamadı: '+e.message,'err');});
    return;
  }
  fotoIndir(fl);
  toast('Bu cihaz fotoğraf paylaşımını desteklemiyor: fotoğraflar indirildi, mesaj WhatsApp\'ta açılıyor.');
  var u=waUrl(r,text);if(u)window.open(u,'_blank','noopener');
}

function isGruplari(r){

    var t=satirTur(s),k=t.id||('x'+norm(t.ad));
    if(!ix[k]){ix[k]={t:t,parcalar:[],tutar:0,notlar:[]};g.push(ix[k]);}
    var a=String(s.aciklama||'').trim();if(a&&ix[k].parcalar.map(norm).indexOf(norm(a))<0)ix[k].parcalar.push(cumle(a));
    satirNotlari(s).forEach(function(n){ix[k].notlar.push({p:a?cumle(a):'',n:n});});
    ix[k].tutar+=parseTutar(s.tutar);});

    isler:g.map(function(x){var p=parcaYaz(x.parcalar);return '• *'+grupAdi(x)+'*'+(p?': '+p:'')+(o.tutar&&x.tutar?' — '+para(x.tutar):'')+grupNotlari(x).map(function(n){return '\n    _Not: '+n+'_';}).join('');}).join('\n'),

    img.onerror=function(){if(typeof src!=='string')URL.revokeObjectURL(url);rej(new Error('Görsel okunamadı. JPG veya PNG dosyası seçin.'));};

  if(isletme){db.firma=isletme.ad;document.title=isletme.uygulama||document.title;var bs=document.querySelector('.brand-sub');if(bs)bs.textContent=isletme.uygulama||'Araç takip';}
  firmaCiz();markalariYaz();
  var k=$('kapali');
  if(isletmeKapali(isletme)){
    if(k)return;
    document.body.appendChild(h('div',{class:'giris',id:'kapali',role:'alertdialog','aria-modal':'true','aria-labelledby':'kT'},
      h('div',{class:'giris-kart'},
        h('div',{class:'giris-ust'},h('div',{class:'mark','aria-hidden':'true',style:'display:grid'},'RSR'),h('div',null,h('h1',{id:'kT'},'Hesap kullanıma kapalı'),h('small',null,titleTr(db.firma)))),
        h('p',{style:'margin:0;color:var(--ink-2)'},isletme.durum==='askida'?'Bu işletmenin hesabı geçici olarak askıya alındı. Kayıtlarınız silinmedi.':'Bu işletmenin kullanım süresi doldu. Kayıtlarınız silinmedi.'),
        h('p',{style:'margin:0;color:var(--ink-2)'},'Yeniden açmak için Xova Software ile iletişime geçin.'))));
    $('app').inert=true;markalariYaz();
  }else if(k){k.remove();if(oturum())$('app').inert=false;else girisEkrani();}
}
window.addEventListener('storage',function(e){if(e.key===YKEY)isletmeUygula();});
isletmeUygula();
/* ---------- mobil klavye: görünür alanı izle, odaklanan alanı görünür yap ---------- */
(function(){
  var R=document.documentElement,vv=window.visualViewport;
  function olc(){if(!vv)return;R.style.setProperty('--vv-h',Math.round(vv.height)+'px');R.style.setProperty('--vv-top',Math.round(vv.offsetTop)+'px');R.classList.toggle('kb-acik',window.innerHeight-vv.height>120||(window.screen&&screen.height-vv.height>screen.height*.38));}
  if(vv){vv.addEventListener('resize',olc);vv.addEventListener('scroll',olc);olc();}
  document.addEventListener('focusin',function(e){
    var t=e.target,genis=window.innerWidth>760;if(!t.matches||!t.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select'))return;
    if(genis&&!t.closest('.modal'))return;/* masaüstünde yalnız pencerelerde: alan sabit başlık/düğme çubuğunun altında kalmasın */
    setTimeout(function(){if(document.activeElement!==t)return;olc();t.scrollIntoView({block:!genis&&t.getAttribute('role')==='combobox'?'start':'nearest',behavior:genis?'auto':'smooth'});},genis?0:320);
  });
})();
girisEkrani();

route();
